name: Build & Test
run-name: Build & Test
permissions:
    contents: read
    checks: write
    pull-requests: write
on:
    push:
    schedule:
        - cron: "0 4 * * SUN"
jobs:
    build-test:
        runs-on: windows-latest
        env:
            CONFIGURATION: Release
            TARGET_FRAMEWORK: net8.0
        steps:
            - name: Checkout Repository
              uses: actions/checkout@v6

            - name: Install .NET
              uses: actions/setup-dotnet@v5
              with:
                  dotnet-version: 8.0.x

            - name: Setup MSBuild
              uses: microsoft/setup-msbuild@v2

            - name: Restore
              run: dotnet restore TestMiner.sln

            - name: Build Database
              run: msbuild TestMiner.Database\TestMiner.Database.sqlproj /p:Configuration=${{ env.CONFIGURATION }} /t:Build

            - name: Build
              id: build
              run: msbuild TestMiner.sln /p:Configuration=${{ env.CONFIGURATION }} /t:Build

            - name: Build Database Docker Image
              run: docker compose -f TestMiner.Database/compose.yaml build

            - name: Test
              run: dotnet test --no-build --configuration ${{ env.CONFIGURATION }} --logger "trx;LogFileName=Results.trx"

            - name: Publish All Test Results
              uses: EnricoMi/publish-unit-test-result-action@v2
              if: (!cancelled())
              with:
                  files: "**/*.trx"
                  action_fail_on_inconclusive: true
