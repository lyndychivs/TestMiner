name: Build & Test
run-name: Build & Test
permissions:
    contents: read
    checks: write
    pull-requests: write
on:
    push:
    schedule:
        - cron: "0 4 * * SUN"
jobs:
    build-test:
        runs-on: ubuntu-latest
        env:
            CONFIGURATION: Release
            TARGET_FRAMEWORK: net8.0
        steps:
            - name: Checkout Repository
              uses: actions/checkout@v6

            - name: Install .NET
              uses: actions/setup-dotnet@v5
              with:
                  dotnet-version: 8.0.x

            - name: Install SqlPackage
              run: dotnet tool install -g microsoft.sqlpackage

            - name: Restore
              run: dotnet restore

            - name: Build Database DACPAC
              run: |
                  mkdir -p TestMiner.Database/bin/${{ env.CONFIGURATION }}
                  sqlpackage /Action:Build \
                    /SourceFiles:"TestMiner.Database/**/*.sql" \
                    /TargetFile:"TestMiner.Database/bin/${{ env.CONFIGURATION }}/TestMiner.dacpac" \
                    /Properties:DatabaseName=TestMiner

            - name: Build
              run: dotnet build --configuration ${{ env.CONFIGURATION }} --no-restore

            - name: Build Database Docker Image
              run: docker compose -f TestMiner.Database/compose.yaml build

            - name: Test
              run: dotnet test --no-build --configuration ${{ env.CONFIGURATION }} --logger "trx;LogFileName=Results.trx"

            - name: Publish All Test Results
              uses: EnricoMi/publish-unit-test-result-action@v2
              if: (!cancelled())
              with:
                  files: "**/*.trx"
                  action_fail_on_inconclusive: true
