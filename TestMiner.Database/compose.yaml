services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: testminer
    hostname: testminer
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "TestMinerPass1!"
      MSSQL_PID: "Express"
      MSSQL_TCP_PORT: "1433"
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U SA -P TestMinerPass1! -Q 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 3